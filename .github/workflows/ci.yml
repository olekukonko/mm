name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Vet
        run: go vet ./...
      - name: Test (race + checkptr)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Benchmark smoke test
        run: |
          go test ./copier/tests -run '^$' \
            -bench 'MM|Mapstructure' -benchtime=100ms -benchmem
